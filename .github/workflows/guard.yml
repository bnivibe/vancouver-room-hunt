name: guard
on:
  push:
  pull_request:
# Read-only token: the job only reads the repo and the pull request's commits.
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m unittest discover -s guard/tests -v
          python -m unittest discover -s skill/tests -v
      - name: Privacy guard
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: python guard/check_public.py
      - name: Privacy guard, every commit
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A leak added in one commit and removed in the next must still fail.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=origin/main
          fi
          python guard/check_public.py --history "$BASE..$HEAD_SHA"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only, so findings fail the job instead of posting a comment.
          GITLEAKS_ENABLE_COMMENTS: false
